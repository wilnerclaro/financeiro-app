spring:
  application:
    name: financeiro-api

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:financeiro_db}
    username: ${POSTGRES_USER:financeiro_user}
    password: ${POSTGRES_PASSWORD:financeiro_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    segredo: ${JWT_SECRET:}
    emissor: financeiro-api
    duracao-acesso: 15m
    duracao-refresh: 7d
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:4200}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: info